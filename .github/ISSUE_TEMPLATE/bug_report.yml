name: Bug Report
description: Report a bug or unexpected behavior
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen?
    validations:
      required: true
  - type: input
    id: modeler-version
    attributes:
      label: Camunda Modeler Version
      placeholder: e.g. 5.28.0
    validations:
      required: true
  - type: dropdown
    id: camunda-version
    attributes:
      label: Camunda Platform
      options:
        - Camunda 7
        - Camunda 8
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can the issue be reproduced?
      value: |
        1.
        2.
        3.
  - type: textarea
    id: logs
    attributes:
      label: Console Output
      description: Open DevTools (F12) and paste any relevant console output.
      render: shell
